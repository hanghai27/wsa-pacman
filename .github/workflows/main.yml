name: Build WSA Pacman Windows

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        # Keep this legacy app on Flutter 3.3.9. The Dart/Flutter/Fluent UI
        # APIs used by the current codebase predate the later Dart 3 and
        # fluent_ui 4.x breaking changes. The job still uses windows-2022 so
        # the hosted runner provides Visual Studio 2022 for the Windows build.
        flutter-version: '3.3.9'

    - name: Clean generated build state
      run: flutter clean

    - name: Install dependencies
      run: flutter pub get

    - name: Build Windows App
      run: flutter build windows

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WSA-Pacman-Windows-App
        path: build/windows/x64/runner/Release/

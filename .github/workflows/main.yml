name: Build WSA Pacman Windows

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        # Do not pin to Flutter 3.19 here: that toolchain can select the
        # Visual Studio 16 2019 CMake generator, but GitHub's supported
        # Windows images no longer provide Visual Studio 2019.
        # Use the current stable Flutter toolchain so Windows builds target
        # the Visual Studio version installed on the hosted runner.

    - name: Clean generated build state
      run: flutter clean

    - name: Install dependencies
      run: flutter pub get

    - name: Build Windows App
      run: flutter build windows

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WSA-Pacman-Windows-App
        path: build/windows/x64/runner/Release/

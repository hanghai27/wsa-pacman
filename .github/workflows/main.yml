name: Build WSA Pacman Windows

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        # Keep this legacy app on Flutter 3.19. Newer stable Flutter/Dart
        # releases remove APIs used by this codebase and disable the
        # synthetic flutter_gen package expected by the current l10n imports.
        # The job uses windows-2022 so Flutter 3.19 can target Visual Studio
        # 2022 instead of encountering the VS 2026/VS 2019 generator mismatch
        # seen on windows-latest.
        flutter-version: '3.19.0'

    - name: Clean generated build state
      run: flutter clean

    - name: Install dependencies
      run: flutter pub get

    - name: Build Windows App
      run: flutter build windows

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WSA-Pacman-Windows-App
        path: build/windows/x64/runner/Release/
